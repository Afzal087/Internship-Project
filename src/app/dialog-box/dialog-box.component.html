<ng-container *ngIf="dialog.message$ | async as message">
  <div class="fixed inset-0 flex items-center justify-center bg-black/50 z-[9999]"
       (click)="close()">

    <div (click)="$event.stopPropagation()"
         class="bg-white/10 text-white backdrop-blur-md p-6 rounded-xl shadow-xl w-[90%] max-w-md border border-white/20">

      <p class="text-base whitespace-pre-wrap">{{ message }}</p>

      <div class="mt-4 flex justify-end">
        <button (click)="close()"
          class="px-4 py-2 rounded-md bg-gradient-to-r from-green-400 to-orange-400 text-black font-semibold">
          OK
        </button>
      </div>

    </div>
  </div>
</ng-container>
