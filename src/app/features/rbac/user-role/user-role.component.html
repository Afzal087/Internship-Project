<div class="flex h-screen bg-slate-50 font-sans overflow-hidden">
  <aside class="w-64 bg-slate-900 text-gray-300 flex flex-col shadow-xl shrink-0">
    <div class="h-14 flex items-center px-6 bg-slate-950 font-bold text-white border-b border-slate-800">
      <span class="text-blue-500 mr-2">🛡️</span> Admin Hub
    </div>

    <nav class="flex-1 p-4 space-y-2">
      <p class="text-[10px] font-bold text-slate-500 uppercase px-2 mb-2">Navigation</p>
      
      <button routerLink="/admin" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="bg-blue-600 text-white" 
              class="w-full flex items-center px-3 py-2 text-sm rounded-lg hover:bg-slate-800 transition-all">
        <span class="mr-3">🏠</span> Dashboard
      </button>

      <button routerLink="add-role" routerLinkActive="bg-blue-600 text-white" 
              class="w-full flex items-center px-3 py-2 text-sm rounded-lg hover:bg-slate-800 transition-all">
        <span class="mr-3">➕</span> New Role
      </button>

      <button routerLink="add-permission" routerLinkActive="bg-blue-600 text-white" 
              class="w-full flex items-center px-3 py-2 text-sm rounded-lg hover:bg-slate-800 transition-all">
        <span class="mr-3">🔑</span> New Permission
      </button>
    </nav>

    <div class="p-4 bg-slate-950 flex items-center border-t border-slate-800">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-xs font-bold text-white uppercase">
      
      </div>
      <div class="ml-3 overflow-hidden">
        <p class="text-xs font-bold text-white truncate"></p>
        <p class="text-[10px] text-slate-500 uppercase">Agray Infosolutions</p>
      </div>
    </div>
  </aside>

  <main class="flex-1 flex flex-col overflow-hidden">
    <header class="h-14 bg-white border-b border-slate-200 flex items-center px-8 justify-between shrink-0">
      <h1 class="text-sm font-bold text-slate-800 uppercase tracking-widest">Access Control System</h1>
    </header>

    <div class="flex-1 p-6 overflow-y-auto bg-slate-50">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
